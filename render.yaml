services:
  - type: web
    name: typing-arena-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    preDeployCommand: npm run db:migrate
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: typing-arena-db
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: CORS_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_TIMEOUT_MS
        value: "8000"

  - type: web
    name: typing-arena-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run generate
    staticPublishPath: .output/public
    autoDeployTrigger: checksPass
    envVars:
      - key: NUXT_PUBLIC_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: typing-arena-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: typing_arena
    user: typing_arena
    ipAllowList: []
