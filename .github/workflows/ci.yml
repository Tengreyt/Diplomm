name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: keyboard_trainer
          POSTGRES_USER: keyboard_trainer
          POSTGRES_PASSWORD: keyboard_trainer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keyboard_trainer -d keyboard_trainer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://keyboard_trainer:keyboard_trainer@localhost:5432/keyboard_trainer

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Migrate database
        run: npm run db:migrate
        working-directory: backend

      - name: Test backend
        run: npm test
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
